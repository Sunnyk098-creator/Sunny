<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">System Login</h1>
        
        <input type="text" id="phone" placeholder="Phone Number" class="w-full mb-4 px-4 py-3 border rounded-xl outline-none">
        <input type="password" id="password" placeholder="Password" class="w-full mb-4 px-4 py-3 border rounded-xl outline-none">
        <input type="text" id="userid" placeholder="Ultra Pay User ID (e.g. 2504)" class="w-full mb-6 px-4 py-3 border rounded-xl outline-none">
        
        <button onclick="saveData()" id="btn" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">Save & Lock System</button>
        <p id="msg" class="mt-4 text-center text-sm font-bold text-green-600"></p>
    </div>

    <script>
        // Replace with your Firebase Realtime DB URL
        const FIREBASE_URL = "https://YOUR-FIREBASE-PROJECT.firebaseio.com/admin_data.json";

        async function saveData() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const userid = document.getElementById('userid').value;

            document.getElementById('btn').innerText = "Saving...";
            
            // Checking if already configured (One-time lock)
            const check = await fetch(FIREBASE_URL);
            const existingData = await check.json();
            if(existingData && existingData.locked) {
                alert("System is already locked! You cannot login again.");
                return;
            }

            const data = { phone, password, userid, locked: true };
            
            await fetch(FIREBASE_URL, {
                method: 'PUT',
                body: JSON.stringify(data)
            });

            document.getElementById('msg').innerText = "Credentials Saved to Firebase & Locked!";
            document.getElementById('btn').innerText = "Locked";
        }
    </script>
</body>
</html>
